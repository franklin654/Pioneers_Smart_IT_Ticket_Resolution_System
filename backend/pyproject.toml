[project]
name = "ticketiq-backend"
version = "0.1.0"
description = "TicketIQ — Smart IT Ticket Resolution System (v2 backend): ingest -> classify -> retrieve -> generate -> route, with a pre-generation confidence gate and human-in-the-loop reclassification."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12,<0.1",
    "websockets>=13.1,<14",
    # Config & schemas
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # DB
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<0.31",
    "pgvector>=0.3.6,<0.4",
    # Auth
    "pyjwt>=2.9,<3",
    "bcrypt>=4.2,<5",
    # PII masking
    "presidio-analyzer>=2.2,<2.3",
    "presidio-anonymizer>=2.2,<2.3",
    "spacy>=3.7,<3.8",
    # Embeddings & classification
    "sentence-transformers>=3.2,<3.3",
    "scikit-learn>=1.5,<1.6",
    "rank-bm25>=0.2.2,<0.3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    # Agents / LLMs
    "pyautogen>=0.3.1,<0.4",
    "anthropic>=0.39,<0.40",
    "httpx>=0.27,<0.28",
    # Observability
    "structlog>=24.4,<25",
    "prometheus-client>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "testcontainers[postgres]>=4.8,<5",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
