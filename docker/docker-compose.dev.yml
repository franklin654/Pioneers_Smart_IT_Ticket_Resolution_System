# Development overrides — source-mount for hot reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    volumes:
      - ../backend/src:/app/src     # live-reload source changes
      - ../backend/data:/app/data
    environment:
      APP_ENV: development
      DEBUG: "true"
      DB_ECHO: "true"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    ports:
      - "5432:5432"   # expose to host for psql / DB tools
