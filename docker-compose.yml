services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ticketiq
      POSTGRES_USER:     ticketiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5544:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ticketiq -d ticketiq"]
      interval: 5s
      timeout:  5s
      retries:  12

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:          postgresql+asyncpg://ticketiq:${POSTGRES_PASSWORD}@postgres:5432/ticketiq
      ADMIN_PASSWORD:        ${ADMIN_PASSWORD}
      JWT_SECRET_KEY:        ${JWT_SECRET_KEY}
      LLM_PROVIDER:          ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL:       ${OLLAMA_BASE_URL:-http://ollama:11434}
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY:-}
      ENVIRONMENT:           production
      LOG_LEVEL:             INFO
      CORS_ALLOWED_ORIGINS:  '["http://localhost"]'
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:     ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  6

  # ---------------------------------------------------------------------------
  # React frontend (nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context:    .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         http://localhost:3000
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # ---------------------------------------------------------------------------
  # Ollama — GPU profile (activate with: docker compose --profile gpu up)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["gpu"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver:       nvidia
              count:        all
              capabilities: [gpu]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  ollama_data:
